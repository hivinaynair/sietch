name: Migrate database

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Drizzle migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ ! -f packages/db/drizzle/meta/_journal.json ]; then
            echo "No Drizzle journal yet; skipping migrate."
            exit 0
          fi
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "DATABASE_URL_UNPOOLED is not set on the GitHub Environment for this branch."
            exit 1
          fi
          bun run db migrate
